<title>ELON: Road to Mars</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;height:100dvh;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#game{position:absolute;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none;outline:none}
#topbtns{position:absolute;display:flex;gap:6px;z-index:6;align-items:center}
.sbtn{width:36px;height:36px;border-radius:9px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;touch-action:none;color:#fff;font-size:16px}
.sbtn svg{width:18px;height:18px;fill:#fff;stroke:#fff}
#sndInd{font-size:14px;line-height:36px;width:22px;text-align:center;pointer-events:none;filter:drop-shadow(0 1px 1px #000)}
#touch{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;display:none;z-index:5}
#touch.on{display:block}
.tbtn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:1px;touch-action:none;transition:background .06s,transform .06s;flex-direction:column;font-size:12px}
.tbtn.on{background:rgba(255,210,63,.5);border-color:#ffd23f;transform:scale(.94)}
.tbtn svg{width:40%;height:40%;fill:#fff}
#dpad{position:absolute;pointer-events:auto;touch-action:none}
#dpad .tbtn{pointer-events:none;top:0}
#tJ,#tF,#tH{pointer-events:auto}
#touch.land .tbtn{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.38)}
#touch.land .tbtn.on{background:rgba(255,210,63,.45);border-color:#ffd23f}
#hint{position:absolute;left:0;right:0;text-align:center;color:rgba(255,255,255,.5);font-size:13px;pointer-events:none;line-height:1.5}
#hint b{color:#ffd23f;font-size:16px;letter-spacing:2px}
#audioHint{position:absolute;left:50%;transform:translateX(-50%);bottom:18%;z-index:8;background:rgba(0,0,0,.72);border:2px solid #ffd23f;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;pointer-events:none;display:none;text-align:center;max-width:90%}
#audioHint.show{display:block}
body.landTouch #audioHint{bottom:12px;top:auto;font-size:13px;padding:7px 12px;max-width:min(56%,420px)}
body.portraitTouch{background:radial-gradient(ellipse at 50% 40%,#16244a 0%,#070a16 60%,#000 100%)}
.pill{position:absolute;z-index:9;display:none;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:2px solid #ffd23f;background:rgba(20,12,4,.82);color:#ffd23f;font:700 14px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;cursor:pointer;touch-action:manipulation;box-shadow:0 0 0 2px #3a1d00,0 0 14px rgba(255,140,40,.55)}
.pill.show{display:flex}
#installBtn{border-color:#7fe7ff;color:#7fe7ff;box-shadow:0 0 0 2px #0a2a33,0 0 12px rgba(127,231,255,.45)}
#bFull{display:none}
#bFull.on{display:flex}

</style>
</head>

<div id="topbtns">

</div>
<button class="pill" id="fsBanner" type="button">&#x26F6; Tap for fullscreen</button>

const TS=16,ROWS=15,VH=240,STEP=1/120;
let VW=320;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash=(x,y)=>{let n=Math.imul(x,73856093)^Math.imul(y,19349663);n=Math.imul(n^(n>>>13),1274126177);return (n^(n>>>16))>>>0;};
const pad=(n,l)=>String(Math.max(0,Math.floor(n))).padStart(l,'0');
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const isTouchCapability=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let isTouch=isTouchCapability; // may flip false once a mouse is used so pads don't appear
let inputMode=isTouchCapability?'touch':'mouse';
function preferPointer(type){
  if(type==='mouse'||type==='pen'){if(inputMode!=='mouse'){inputMode='mouse';isTouch=false;layout();}}
  else if(type==='touch'){if(inputMode!=='touch'){inputMode='touch';isTouch=isTouchCapability;layout();}}
}
const UNLOCK_KEY='elonRoadUnlocked';
const CLEARED_KEY='elonRoadCleared';
// Always all stages open; ignore/clear legacy unlock gate.
try{localStorage.removeItem(UNLOCK_KEY);}catch(e){}
function getUnlocked(){return 12;}
function setUnlocked(n){return 12;} // no-op gate (kept for API compat)
function getCleared(){try{const v=store.get(CLEARED_KEY,'');if(!v)return new Set();return new Set(String(v).split(',').map(Number).filter(n=>n>=0&&n<12));}catch(e){return new Set();}}
function markCleared(i){if(i<0||i>11)return;const s=getCleared();s.add(i|0);store.set(CLEARED_KEY,[...s].sort((a,b)=>a-b).join(','));}

  p(11,9,S2);p(11,10,S2,2,1);p(10,11,S2);p(12,11,S2);

  const ly=25;

  else if(legs==='run1'){p(4,ly,J,4,3);p(15,ly,J,4,3);p(3,ly+3,J2,3,1);p(16,ly+3,J2,3,1);p(2,ly+4,B,4,1);p(17,ly+4,B,4,1);p(2,ly+5,B,3,1);p(18,ly+5,B,3,1);}
  else if(legs==='run2'){p(8,ly,J,8,3);p(8,ly+3,J2,3,1);p(13,ly+3,J2,3,1);p(8,ly+4,B,4,1);p(13,ly+4,B,4,1);p(9,ly+5,B,3,1);p(13,ly+5,B,3,1);}
  else if(legs==='run3'){p(6,ly,J,3,3);p(14,ly,J,4,3);p(5,ly+3,J2,3,1);p(15,ly+3,J2,3,1);p(4,ly+4,B,3,1);p(16,ly+4,B,4,1);p(4,ly+5,B,3,1);p(17,ly+5,B,3,1);}
  else{p(6,ly,J,5,3);p(13,ly,J,5,3);p(5,ly+3,J2,4,1);p(14,ly+3,J2,4,1);p(5,ly+4,B,3,1);p(15,ly+4,B,4,1);p(5,ly+5,B,3,1);p(16,ly+5,B,3,1);}
  return c;
}

function vnoise(seed){const h=(x,y)=>{let n=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(seed,1442695)|0;n=Math.imul(n^(n>>>13),1274126177);return((n^(n>>>16))>>>0)/4294967296;};return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=h(xi,yi),b=h(xi+1,yi),c=h(xi,yi+1),d=h(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;};}

function blob(g,w,cx,cy,circles,col,shade){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;circles.forEach(([dx,dy,r])=>{x0=Math.min(x0,cx+dx-r);x1=Math.max(x1,cx+dx+r);y0=Math.min(y0,cy+dy-r);y1=Math.max(y1,cy+dy+r);});for(let y=Math.floor(y0);y<=y1;y++)for(let x=Math.floor(x0);x<=x1;x++){let ins=false;for(const[dx,dy,r]of circles){const ax=x+.5-(cx+dx),ay=y+.5-(cy+dy);if(ax*ax+ay*ay<=r*r){ins=true;break;}}if(!ins)continue;g.fillStyle=(y>cy+3)?shade:col;g.fillRect(((x%w)+w)%w,y,1,1);}}

const THEMES={};
function getTheme(name){
  if(THEMES[name])return THEMES[name];
  const T={name};
  const richTop=(cols)=>[0,1].map(v=>tileFn((x,y,r)=>{
    if(y===0)return cols[0];if(y===1)return cols[1];
    if(y<5){if(x===0||x===15)return cols[3];return r()<.14?cols[2]:cols[1];}
    if(y===5)return cols[3];
    return r()<.12?cols[4]||cols[2]:cols[3];
  },10+v+name.length));
  const richFill=(cols)=>[0,1].map(v=>tileFn((x,y,r)=>{
    if(x===0||x===15)return cols[1];
    const q=r();return q<.1?cols[0]:(q<.16?cols[2]||cols[0]:cols[1]);
  },20+v+name.length));
  if(name==='desert'||name==='starbase'){T.top=richTop(['#f3efe6','#e3ddd0','#b8b09f','#d6b27a','#c09a60']);T.fill=richFill(['#c09a60','#d3ae75','#e3c48e']);T.sky=['#3d8fe8','#8ccaf7','#d4eefc'];T.walker=WALK_GREY;T.accent='#c4a060';}
  else if(name==='beach'){T.top=richTop(['#fffaf0','#fff0c8','#e8d898','#f0e0a8','#d8c878']);T.fill=richFill(['#c8b868','#e0d088','#f0e8b0']);T.sky=['#4aa8e8','#7ec8f8','#c8e8ff'];T.walker=WALK_GREY;T.accent='#5ec8e8';}
  else if(name==='factory'){T.top=richTop(['#e0e4ec','#b0b6c0','#6a707a','#8a909a','#5a606a']);T.fill=richFill(['#5a606a','#7a808a','#4a505a']);T.sky=['#2a3040','#3a4558','#4a5568'];T.walker=WALK_GREY;T.accent='#ff6a3d';}
  else if(name==='tunnel'){T.top=richTop(['#8a8a92','#5a5a62','#3a3a42','#505058','#2a2a32']);T.fill=richFill(['#2a2a32','#3a3a42','#1a1a22']);T.sky=['#0a0a12','#12121c','#1a1a28'];T.walker=WALK_GREY;T.accent='#ffe08a';}
  else if(name==='highway'){T.top=richTop(['#7a7a82','#4a4a52','#2a2a32','#5a5a62','#3a3a42']);T.fill=richFill(['#2a2a32','#3a3a42','#1a1a22']);T.sky=['#87b8e0','#a8d0f0','#d0e8ff'];T.walker=WALK_RUST;T.accent='#ffd23f';}
  else if(name==='lab'){T.top=richTop(['#f0f6ff','#c8d8f0','#8898b0','#a8b8d0','#687888']);T.fill=richFill(['#687888','#8898a8','#506070']);T.sky=['#1a2040','#2a3860','#3a4880'];T.walker=HOP_GOLD;T.accent='#40e0ff';}
  else if(name==='tower'){T.top=richTop(['#ffffff','#eef2f7','#9aa3b1','#b3bbc7','#7c8594']);T.fill=richFill(['#5d6573','#7c8594','#4a5260']);T.sky=['#5a9fe0','#8ccaf7','#d4eefc'];T.walker=WALK_GREY;T.accent='#c8d0da';}
  else if(name==='clouds'){T.top=richTop(['#ffffff','#f0f4fa','#c0c8d8','#d8e0ec','#a8b0c0']);T.fill=richFill(['#a0a8b8','#c0c8d8','#8890a0']);T.sky=['#6ab0f0','#9ad0ff','#e0f0ff'];T.walker=WALK_GREY;T.accent='#ffffff';}
  else if(name==='orbit'){
    T.top=[0,1].map(v=>tileFn((x,y)=>{if(y===0)return'#eef3fa';if(y===1)return'#c3ccda';if(y<5){if((x===2||x===13)&&y===3)return'#5a6478';return'#8e99ad';}if(y<7)return(((x+(y-5)*2+(v?2:0))>>1)%2)?'#f2c230':'#24262e';if(y===7)return'#3a4458';const yy=y-8;if(x<2||x>13)return x===0||x===15?'#323b4f':'#4d5a75';if(Math.abs((x-2)-yy*11/7)<1.1||Math.abs((13-x)-yy*11/7)<1.1)return'#62708e';return null;},30+v));
    T.fill=[0,1].map(v=>tileFn((x,y)=>{if(x<2||x>13)return x===0||x===15?'#323b4f':'#4d5a75';if(y<2)return'#4d5a75';if(Math.abs(x-y)<1.1||Math.abs(15-x-y)<1.1)return'#5a6884';return null;},40+v));
    T.sky=['#03040c','#0a0f2a','#16245a'];T.walker=WALK_GREY;T.accent='#f2c230';
  }else if(name==='moon'){T.top=richTop(['#f0f0f0','#d8d8d8','#a0a0a8','#c0c0c8','#909098']);T.fill=richFill(['#707078','#909098','#606068']);T.sky=['#000008','#080818','#101028'];T.walker=WALK_GREY;T.accent='#c0d0e0';}
  else{T.top=richTop(['#f4a070','#e88a58','#c4542f','#ad4a2b','#8f3a22']);T.fill=richFill(['#6f2a18','#8a3720','#a8482a']);T.sky=['#a8553a','#de935f','#f3c48f'];T.walker=WALK_RUST;T.accent='#ffd23f';}
  T.edge=true;T.smoke=name!=='orbit'&&name!=='moon'&&name!=='blastar';

}
const SKY={};
function skyGrad(name){if(SKY[name])return SKY[name];const T=getTheme(name),g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,T.sky[0]);g.addColorStop(.55,T.sky[1]);g.addColorStop(1,T.sky[2]);return SKY[name]=g;}
function drawBG(name,cx,t){
  const T=getTheme(name),L=T.bg;ctx.fillStyle=skyGrad(name);ctx.fillRect(0,0,VW,VH);
  if(name==='desert'||name==='starbase'||name==='tower'||name==='beach'||name==='highway'||name==='clouds')ctx.drawImage(SUN,VW-64,16);
  if(name==='mars'){ctx.drawImage(MSUN,VW-70,30);ctx.fillStyle='#8a6a5a';ctx.fillRect(Math.round(VW*.22),24,4,3);}
  for(const l of L){drawLayer(l.c,l.f,cx,l.y||0,l.drift?t*l.drift:0);}
  if(name==='orbit'||name==='moon'){for(const s of TWINK){const b=(Math.sin(t*2+s.p*7)+1)/2;if(b>.6){ctx.fillStyle=b>.9?'#ffffff':'#aab8ff';const x=Math.round(((s.x*VW*1.3-cx*.02)%VW+VW)%VW),y=Math.round(s.y*VH);ctx.fillRect(x,y,1,1);}}}
  if(name==='mars'){ctx.fillStyle='rgba(255,220,180,.55)';for(const d of DUST){const x=Math.round(((d.x-t*22*d.s-cx*.6*d.s)%VW+VW)%VW),y=Math.round(d.y+Math.sin(t+d.a)*6);ctx.fillRect(x,y,1,1);}}
}
function drawGround(name,y0){const T=getTheme(name);for(let x=0;x<VW;x+=16){ctx.drawImage(T.top[(x>>4)&1],x,y0);ctx.drawImage(T.fill[(x>>4)&1],x,y0+16);}}

let AC=null,master=null,sfxG=null,musG=null,musDry=null,musWet=null,musDelay=null,noiseBuf=null,unlocked=false,audioHint=true;
let muted=store.get('elonMute','0')==='1';
const VOL={master:0.9,mus:0.42,sfx:0.72};
let musWant=0.42;
const mus={on:false,id:null,tr:null,step:0,next:0};
let jetOsc=null,jetGain=null,jetOn=false;
function ensureAudioGraph(){
  if(AC)return true;
  try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;
    AC=new A();master=AC.createGain();master.gain.value=muted?0:VOL.master;master.connect(AC.destination);
    sfxG=AC.createGain();sfxG.gain.value=VOL.sfx;sfxG.connect(master);
    musG=AC.createGain();musG.gain.value=VOL.mus;
    musDry=AC.createGain();musDry.gain.value=.92;musG.connect(musDry);musDry.connect(master);
    musDelay=AC.createDelay(1.0);musDelay.delayTime.value=.22;
    const fb=AC.createGain();fb.gain.value=.28;musDelay.connect(fb);fb.connect(musDelay);
    const filt=AC.createBiquadFilter();filt.type='lowpass';filt.frequency.value=3200;
    musWet=AC.createGain();musWet.gain.value=.38;
    musG.connect(musDelay);musDelay.connect(filt);filt.connect(musWet);musWet.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return true;
  }catch(e){AC=null;return false;}
}
function unlockAudio(){
  if(!ensureAudioGraph())return;
  if(AC.state==='suspended'&&G.state!=='exit')AC.resume().catch(()=>{});
  if(!unlocked&&AC){try{const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);unlocked=true;audioHint=false;const ah=document.getElementById('audioHint');if(ah)ah.classList.remove('show');try{if(!muted)SFX.unlockSting();}catch(e){}if(G&&(G.state==='title'||G.state==='stageselect'))setMusic('title');}catch(e){}}
  syncMuteUI();

const isSolid=c=>c==='#'||c==='B'||c==='C'||c==='P'||c==='V'||c==='N';
function groundTop(L,x){for(let y=0;y<ROWS;y++){const c=L.map[y][x];if(isSolid(c)||c==='='||c==='~')return y;}return ROWS;}
function mkEnemy(type,px,bottom){if(type==='f')return{type,x:px+1,y:bottom-12,w:14,h:10,bx:px+1,by:bottom-12,t:Math.random()*6,dir:-1,active:false,dead:false,px:px+1,py:bottom-12,anim:0};
 return{type,x:px+1,y:bottom-14,w:14,h:14,vx:0,vy:0,dir:-1,ground:false,hopT:.6+Math.random(),active:false,dead:false,px:px+1,py:bottom-14,anim:Math.random()};}
function buildLevel(idx){
  const def=LEVELS[idx],W=def.W,map=[];for(let y=0;y<ROWS;y++)map.push(new Array(W).fill('.'));
  const L={idx,def,W,map,ents:[],coins:[],crates:[],plats:[],cps:[],signs:[],bounces:[],convs:[],tower:null,theme:getTheme(def.theme)};
  const late=[];
  const b={
    g(x0,x1,top=12){for(let x=x0;x<=x1&&x<W;x++)for(let y=top;y<ROWS;y++)map[y][x]='#';},
    blk(x,y,w=1,h=1){for(let i=0;i<w;i++)for(let j=0;j<h;j++)if(y+j<ROWS&&x+i<W)map[y+j][x+i]='B';},
    plat(x,y,w){for(let i=0;i<w;i++)if(x+i<W)map[y][x+i]='=';},
    crate(x,y,type){if(x<W){map[y][x]=type;L.crates.push({tx:x,ty:y,type,used:false,bump:0});}},
    coins(x,y,n){for(let i=0;i<n;i++)L.coins.push({x:(x+i)*16+8,y:y*16+8,got:false});},
    arc(x,y,n){for(let i=0;i<n;i++)L.coins.push({x:(x+i)*16+8,y:(y-Math.round(Math.sin(Math.PI*(n===1?0.5:i/(n-1)))*1.6))*16+8,got:false});},
    en(type,x,y){L.ents.push(mkEnemy(type,x*16,(y+1)*16));},
    enG(type,x){late.push(()=>L.ents.push(mkEnemy(type,x*16,groundTop(L,x)*16)));},
    mp(x,y,w,ax,ay,per){L.plats.push({x0:x*16,y0:y*16,x:x*16,y:y*16,px:x*16,py:y*16,w:w*16,h:6,ax:ax*16,ay:ay*16,per,t:0,dx:0,dy:0,prevY:y*16});},
    cp(x){late.push(()=>L.cps.push({x:x*16+8,y:groundTop(L,x)*16,on:false}));},
    sign(x,text){L.signs.push({x,text});},
    bounce(x,y){map[y][x]='N';L.bounces.push({tx:x,ty:y});},
    conv(x,y,w,dir){for(let i=0;i<w;i++)if(x+i<W){map[y][x+i]='V';L.convs.push({tx:x+i,ty:y,dir});}},
    tower(x,booster){late.push(()=>{const gy=groundTop(L,x)*16;const T={tx:x,x:x*16,gy,booster};T.shipX=T.x+22;const mt=gy-20;T.shipTop=booster?mt-136:mt-64;T.doorY=T.shipTop+30;T.towerTop=T.shipTop-6;T.armY=booster?mt-64:T.shipTop+44;L.tower=T;});}
  };
  def.build(b);late.forEach(f=>f());
  // render canvas
  const c=mk(W*16,VH),g=c.getContext('2d'),T=L.theme;
  for(let y=0;y<ROWS;y++)for(let x=0;x<W;x++){const ch=map[y][x],px=x*16,py=y*16;
    if(ch==='#'){const top=y===0||map[y-1][x]!=='#';const v=hash(x,y)&1;g.drawImage(top?T.top[v]:T.fill[v],px,py);}
    else if(ch==='B')g.drawImage(STEEL,px,py);else if(ch==='=')g.drawImage(DISH,px,py);
    else if(ch==='V')g.drawImage(CONVEY,px,py);else if(ch==='N')g.drawImage(BOUNCE,px,py);
  }
  for(const s of L.signs){const gy=groundTop(L,s.x)*16,w=textW(s.text)+8,x0=s.x*16;g.fillStyle='#5a4a3a';g.fillRect(x0+4,gy-22,2,22);g.fillStyle='#2b2f3a';g.fillRect(x0,gy-32,w,13);drawText(s.text,x0+4,gy-29,'#fff',1,'left',null,g);}
  L.canvas=c;return L;
}

// particles
function part(x,y,vx,vy,life,col,sz=1,g=0,type=0){if(parts.length>700)parts.shift();parts.push({x,y,vx,vy,life,max:life,col,sz,g,type,drag:0});}
function burst(x,y,n,cols,spd,life,sz=1,g=300){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=spd*(.4+Math.random()*.6);part(x,y,Math.cos(a)*s,Math.sin(a)*s-spd*.3,life*(.6+Math.random()*.6),cols[i%cols.length],sz,g);}}
function sparkle(x,y,n=6){for(let i=0;i<n;i++){const a=i/n*6.283+Math.random()*.5,s=40+Math.random()*50;part(x,y,Math.cos(a)*s,Math.sin(a)*s,.35+Math.random()*.25,i%2?'#ffffff':'#ffe066',1,0,1);}}
function dust(x,y,n=3,dir=0){for(let i=0;i<n;i++)part(x+rnd(-3,3),y-1,rnd(-30,30)+dir*30,rnd(-35,-8),rnd(.25,.45),'#efe2c4',1,40);}
function popup(x,y,txt,col='#fff'){pops.push({x,y,txt,col,t:0});}
function shake(m){G.shake=Math.max(G.shake,m);}
function vib(ms){try{if(isTouch&&navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function updateParts(dt){for(const p of parts){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}parts=parts.filter(p=>p.life>0);for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<.9);
 for(const c of popc){c.t+=dt;c.vy+=700*dt;c.y+=c.vy*dt;if(c.t>.42&&!c.done){c.done=true;sparkle(c.x,c.y,5);}}popc=popc.filter(c=>!c.done);}

// collision
function tileAt(tx,ty){if(tx<0||tx>=LV.W)return'#';if(ty<0||ty>=ROWS)return'.';return LV.map[ty][tx];}
function moveX(o,dx){if(!dx)return false;o.x+=dx;const t0=Math.floor(o.y/16),t1=Math.floor((o.y+o.h-.01)/16);
 if(dx>0){const tx=Math.floor((o.x+o.w-.01)/16);for(let ty=t0;ty<=t1;ty++)if(isSolid(tileAt(tx,ty))){o.x=tx*16-o.w;return true;}}
 else{const tx=Math.floor(o.x/16);for(let ty=t0;ty<=t1;ty++)if(isSolid(tileAt(tx,ty))){o.x=(tx+1)*16;return true;}}return false;}
function moveY(o,dy,prevB){o.y+=dy;const t0=Math.floor(o.x/16),t1=Math.floor((o.x+o.w-.01)/16);
 if(dy>0){const ty=Math.floor((o.y+o.h-.01)/16);for(let tx=t0;tx<=t1;tx++){const c=tileAt(tx,ty);if(isSolid(c)||((c==='='||c==='~')&&prevB<=ty*16+.5)){o.y=ty*16-o.h;return 1;}}}
 else if(dy<0){const ty=Math.floor(o.y/16);for(let tx=t0;tx<=t1;tx++){if(isSolid(tileAt(tx,ty))){o.y=(ty+1)*16;return -1;}}}return 0;}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function updatePlats(dt){for(const p of LV.plats){p.px=p.x;p.py=p.y;p.prevY=p.y;p.t+=dt;const k=.5-.5*Math.cos(6.2832*p.t/p.per);const nx=p.x0+p.ax*k,ny=p.y0+p.ay*k;p.dx=nx-p.x;p.dy=ny-p.y;p.x=nx;p.y=ny;}}
function hitCrate(c){c.bump=.16;if(c.used){SFX.bump();return;}c.used=true;const cx=c.tx*16+8,cy=c.ty*16;
 if(c.type==='C'){popc.push({x:cx,y:cy-8,vy:-260,t:0});addCoin();G.score+=100;popup(cx,cy-20,'100');}
 else{items.push({x:c.tx*16+2,y:cy,w:12,h:13,base:cy-17,em:0,t:0,cy});SFX.crate();}
 burst(cx,cy,4,['#ffd23f','#ffffff'],60,.3,1,200);}
function addCoin(){G.coins++;SFX.coin();if(G.coins>=100){G.coins-=100;G.lives++;SFX.oneup();popup(P.x+5,P.y-10,'1UP!','#5fff8f');}}
function killEnemy(e,flipped){e.dead=true;e.deadT=0;e.flip=flipped||e.type==='f';e.vy=flipped?-220:0;e.vx=flipped?rnd(-30,30):0;
 const cx=e.x+e.w/2,cy=e.y+e.h/2;burst(cx,cy,10,['#e03a3a','#ffffff','#9aa3b5','#ffd23f'],120,.65,1,380);}
function hurt(){if(P.inv>0||P.dead)return;if(P.power){P.power=0;P.inv=1.6;SFX.hurt();shake(4);vib(60);popup(P.x+5,P.y-6,'JETPACK LOST','#ff9a6a');}else die(false);}
function die(pit){if(P.dead)return;P.dead=true;G.state='dying';G.deathT=0;G.pit=pit;P.vx=0;P.vy=0;P.popped=false;stopMusic();SFX.die();shake(pit?2:5);vib(pit?40:90);}

function updatePlayer(dt){
  const ph=LV.def.phys;P.px=P.x;P.py=P.y;
  const dir=(inp.r?1:0)-(inp.l?1:0);
  if(P.onPlat){const p=P.onPlat;P.x+=p.dx;P.y=p.y-P.h;}
  // conveyor
  if(P.ground){const tx=Math.floor((P.x+P.w/2)/16),ty=Math.floor((P.y+P.h)/16);if(tileAt(tx,ty)==='V'){const c=LV.convs.find(c=>c.tx===tx&&c.ty===ty);if(c)P.x+=c.dir*60*dt;}}
  if(dir){const turning=P.vx*dir<0;const a=P.ground?(turning?TURN:ACC):AIR;P.vx+=dir*a*dt;if(Math.abs(P.vx)>MAXV)P.vx=Math.sign(P.vx)*Math.max(MAXV,Math.abs(P.vx)-DEC*dt);P.face=dir;}
  else{const d=(P.ground?DEC:AIRDEC)*dt;if(Math.abs(P.vx)<=d)P.vx=0;else P.vx-=Math.sign(P.vx)*d;}
  // wind
  if(LV.def.wind)P.vx+=LV.def.wind*dt*.3;
  P.jumpBuf-=dt;if(P.ground)P.coyote=COYOTE;else P.coyote-=dt;
  if(P.jumpBuf>0){if(P.coyote>0){P.vy=-ph.jv*(1+Math.abs(P.vx)/MAXV*.06);P.ground=false;P.coyote=0;P.jumpBuf=0;P.onPlat=null;P.sq=1.25;SFX.jump();dust(P.x+5,P.y+P.h,3);}
   else if(P.power&&!P.dj){P.vy=-ph.djv;P.dj=true;P.jumpBuf=0;P.jetT=.35;P.sq=1.2;SFX.djump();}}
  // bounce pads
  if(P.ground){const tx=Math.floor((P.x+P.w/2)/16),ty=Math.floor((P.y+P.h)/16);if(tileAt(tx,ty)==='N'){P.vy=-ph.jv*1.35;P.ground=false;P.coyote=0;P.dj=false;SFX.jump();shake(2);}}
  let gm;if(P.vy<0)gm=inp.j?(P.vy>-60?.55:1):2.9;else gm=P.vy<50&&inp.j?.65:1.25;
  P.vy=Math.min(P.vy+ph.g*gm*dt,ph.maxFall);
  if(moveX(P,P.vx*dt))P.vx=0;
  if(P.onPlat){const p=P.onPlat;if(P.x+P.w<p.x||P.x>p.x+p.w||P.vy<0)P.onPlat=null;}
  const wasG=P.ground,vyB=P.vy,prevB=P.y+P.h;P.ground=false;
  const r=moveY(P,P.vy*dt,prevB);
  if(r===1){P.ground=true;P.vy=0;P.onPlat=null;}
  else if(r===-1){const ty=Math.floor(P.y/16)-1,cxp=P.x+P.w/2;let best=null,bd=99;for(const c of LV.crates){if(c.ty===ty&&c.tx*16<P.x+P.w&&c.tx*16+16>P.x){const d=Math.abs(c.tx*16+8-cxp);if(d<bd){bd=d;best=c;}}}if(best)hitCrate(best);else SFX.bump();P.vy=30;}
  if(P.vy>=0){for(const p of LV.plats){if(P.x+P.w>p.x&&P.x<p.x+p.w&&prevB<=Math.max(p.y,p.prevY)+1.5&&P.y+P.h>=p.y){P.y=p.y-P.h;P.vy=0;P.ground=true;P.onPlat=p;}}}
  if(P.ground&&!wasG){P.dj=false;P.combo=0;if(vyB>160){P.sq=.72;dust(P.x+5,P.y+P.h,4);}}
  P.sq=lerp(P.sq,1,1-Math.exp(-dt*14));
  if(Math.abs(P.vx)>5&&P.ground)P.anim+=Math.abs(P.vx)*dt*.085;else if(P.ground)P.anim=0;
  P.inv=Math.max(0,P.inv-dt);P.jetT=Math.max(0,P.jetT-dt);jetUpdate();
  P.blinkT-=dt;if(P.blinkT<0){P.blink=true;if(P.blinkT<-.12){P.blink=false;P.blinkT=2+Math.random()*3;}}
  P.look=lerp(P.look,P.face*28,1-Math.exp(-dt*2.5));
  if(P.y>VH+24){die(true);return;}
  for(const c of LV.coins){if(!c.got&&Math.abs(c.x-(P.x+6))<10&&Math.abs(c.y-(P.y+10))<14){c.got=true;addCoin();G.score+=50;sparkle(c.x,c.y,7);}}
  for(const it of items){if(it.em>=.6&&!it.got&&overlap(P,it)){it.got=true;if(P.power){G.score+=1000;SFX.coin();}else{P.power=1;SFX.power();popup(it.x+6,it.y-8,'JETPACK!','#7fe7ff');}burst(it.x+6,it.y+6,12,['#ffffff','#7fe7ff','#ffd23f'],140,.5,1,100);}}
  items=items.filter(i=>!i.got);
  for(const c of LV.cps){if(!c.on&&P.x+6>=c.x){c.on=true;G.cp={level:G.level,x:c.x};SFX.check();popup(c.x,c.y-44,'CHECKPOINT','#5fff8f');}}
  for(const e of LV.ents){if(e.dead||!e.active)continue;const hb={x:e.x+2,y:e.y+2,w:e.w-4,h:e.h-2};if(!overlap(P,hb))continue;
   if(P.vy>0&&P.py+P.h<=e.py+(e.type==='f'?7:8)){killEnemy(e,false);P.vy=inp.j?-ph.jv*.98:-ph.jv*.6;P.dj=false;P.combo++;const pts=[100,200,400,800][Math.min(P.combo-1,3)];G.score+=pts;popup(e.x+7,e.y-4,String(pts));SFX.stomp();shake(2.5);G.hitstop=.045;}
   else hurt();}
  const T=LV.tower;if(T&&P.x+P.w>=T.x+2&&G.state==='play')beginClear();
}
function updateEnemies(dt){const g=LV.def.phys.g;
 for(const e of LV.ents){if(e.dead){e.deadT+=dt;e.px=e.x;e.py=e.y;if(e.flip){e.vy+=700*dt;e.y+=e.vy*dt;e.x+=e.vx*dt;}if(e.deadT>(e.flip?2.5:.45))e.remove=true;continue;}
  if(!e.active){if(e.x<cam.x+VW+40&&e.x>cam.x-80)e.active=true;else continue;}
  e.px=e.x;e.py=e.y;e.anim+=dt;
  if(e.type==='f'){e.t+=dt;if(G.state==='play'){const dx=P.x-e.x;if(Math.abs(dx)<160)e.bx+=Math.sign(dx)*13*dt;}const nx=e.bx+Math.sin(e.t*.9)*26;e.dir=nx<e.x?-1:1;e.x=nx;e.y=e.by+Math.sin(e.t*2.4)*7;continue;}
  const sp=e.type==='h'?32:27;e.vx=e.dir*sp;
  if(e.type==='h'&&e.ground){e.hopT-=dt;if(e.hopT<=0){e.vy=-240;e.hopT=1+Math.random()*.9;e.ground=false;}}
  e.vy=Math.min(e.vy+g*dt,400);
  if(moveX(e,e.vx*dt))e.dir*=-1;
  else if(e.ground){const fx=e.dir>0?e.x+e.w+1:e.x-1;const c=tileAt(Math.floor(fx/16),Math.floor((e.y+e.h+2)/16));if(!isSolid(c)&&c!=='=')e.dir*=-1;}
  const pb=e.y+e.h;e.ground=false;const r=moveY(e,e.vy*dt,pb);if(r===1){e.ground=true;e.vy=0;}else if(r===-1)e.vy=0;
  if(e.y>VH+40)e.remove=true;}
 LV.ents=LV.ents.filter(e=>!e.remove);}
function updateItems(dt){for(const it of items){it.t+=dt;if(it.em<1){it.em=Math.min(1,it.em+dt/.6);it.y=it.cy-17*it.em;}else it.y=it.base+Math.sin(it.t*3)*2;}for(const c of LV.crates)c.bump=Math.max(0,c.bump-dt);}
function updateCamera(dt){if(G.state==='dying'||!P)return;const target=P.x+P.w/2-VW*.42+P.look;cam.x+=(target-cam.x)*(1-Math.exp(-dt*7));cam.x=clamp(cam.x,0,LV.W*16-VW);}
function updateDying(dt){G.deathT+=dt;P.px=P.x;P.py=P.y;if(G.deathT>.45){if(!P.popped){P.popped=true;if(!G.pit)P.vy=-310;}P.vy+=900*dt;P.y+=P.vy*dt;}
 if(G.deathT>2.4){G.lives--;G.power=0;if(G.lives<=0){G.state='gameover';G.stT=0;saveHi();SFX.gameover();setMusic('gameover');}else startLevel();}}
function beginClear(){G.state='clear';stopMusic();SFX.clear();P.vx=0;P.vy=0;P.onPlat=null;P.x=LV.tower.x+2;P.face=1;P.inv=0;G.clr={ph:'elev',t:0,ry:0,rv:0,bonus:Math.max(0,200-Math.floor(G.levelTime))*10,added:0,beeps:0};}
function smokeAt(x,y,n,sp){for(let i=0;i<n;i++)part(x+rnd(-6,6),y,rnd(-1,1)*sp,rnd(-30,-5),rnd(1,2),'#e6e6e6',2+(Math.random()*3|0),-8,2);}
function updateClear(dt){const C=G.clr,T=LV.tower;C.t+=dt;P.px=P.x;P.py=P.y;
 if(C.ph==='elev'){P.ground=true;P.y-=95*dt;if(P.y+P.h<=T.doorY){P.y=T.doorY-P.h;C.ph='walk';C.t=0;}}
 else if(C.ph==='walk'){P.vx=50;P.x+=50*dt;P.anim+=50*dt*.085;if(P.x>=T.shipX+2){P.hidden=true;P.vx=0;C.ph='count';C.t=0;SFX.door();}}
 else if(C.ph==='count'){if(C.beeps<3&&C.t>=C.beeps*.6+.2){SFX.beep(false);C.beeps++;}if(C.t>.8)smokeAt(T.shipX+9,T.gy-20,1,60);if(C.t>2){C.ph='launch';C.t=0;SFX.beep(true);SFX.launch();}}
 else if(C.ph==='launch'){C.rv+=(40+C.t*140)*dt;C.ry-=C.rv*dt;shake(Math.max(.6,3.2-C.t*1.2));smokeAt(T.shipX+9,Math.min(T.gy-20+C.ry+20,T.gy-4),C.t<1.6?4:1,80);if(C.t>3.1){C.ph='tally';C.t=0;}}
 else if(C.ph==='tally'){const k=Math.min(1,C.t/1.2),tg=Math.floor(C.bonus*k);if(tg>C.added){G.score+=tg-C.added;C.added=tg;SFX.tick();}if(C.t>1.6&&!C.menu){C.menu=true;G.menuSel=0;}}}

// ===== BLASTAR =====
function spawnWave(n){
  const kinds=n<3?1:(n<6?2:3);
  for(let i=0;i<3+Math.min(n,4);i++){
    BS.enemies.push({x:rnd(20,VW-50),y:rnd(-90,-10),w:32,h:26,vx:rnd(-30,30),vy:rnd(20,40+n*3),hp:1,t:Math.random()*6,shootT:1+Math.random(),type:0});
  }
  if(n>=3&&n%3===0)BS.enemies.push({x:VW/2-20,y:-40,w:32,h:26,vx:40,vy:15,hp:3,t:0,shootT:.8,type:1});
}
function updateBlastar(dt){
  if(!BS||G.paused)return;
  BS.t+=dt;if(BS.flash>0)BS.flash-=dt;
  if(BS.state==='dead'){if(BS.t>2){G.lives=BS.lives;if(BS.lives<=0){G.state='gameover';G.stT=0;saveHi();SFX.gameover();setMusic('gameover');BS=null;}else{BS.state='play';BS.t=0;BS.x=VW/2-20;BS.y=VH-56;BS.inv=1.5;}}return;}
  if(BS.state==='won'){BS.t+=dt;if(BS.t>2){G.score=BS.score;markCleared(11);G.level=12;G.state='win';G.stT=0;saveHi();SFX.win();setMusic('win');wcoins=[];BS=null;}return;}
  // move
  const sp=140;BS.vx=((inp.r?1:0)-(inp.l?1:0))*sp;BS.vy=((inp.d?1:0)-(inp.u?1:0))*sp;
  BS.x=clamp(BS.x+BS.vx*dt,4,VW-BS.w-4);BS.y=clamp(BS.y+BS.vy*dt,20,VH-BS.h-8);
  BS.cool=Math.max(0,BS.cool-dt);BS.inv=Math.max(0,(BS.inv||0)-dt);
  if(inp.f&&BS.cool<=0){BS.bullets.push({x:BS.x+BS.w/2-3,y:BS.y-6,w:6,h:12,vy:-300});BS.cool=.18;SFX.shoot();}
  for(const b of BS.bullets)b.y+=b.vy*dt;BS.bullets=BS.bullets.filter(b=>b.y>-10);
  // waves
  if(!BS.boss){BS.waveT-=dt;if(BS.enemies.length===0&&BS.waveT<=0){BS.wave++;if(BS.wave>5){// boss
    BS.boss={x:VW/2-40,y:20,w:80,h:48,hp:8,max:8,vx:45,t:0,shootT:1.1};SFX.beep(true);popup(VW/2,80,'STATUS BEAM','#ff6a3d');
   }else{spawnWave(BS.wave);BS.waveT=1.5;}}
  }
  for(const e of BS.enemies){e.t+=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.x<4||e.x>VW-e.w-4)e.vx*=-1;e.shootT-=dt;if(e.shootT<=0&&e.y>10&&e.y<VH*.6){BS.ebullets.push({x:e.x+e.w/2,y:e.y+e.h,w:3,h:6,vy:70+BS.wave*4});e.shootT=1.6+Math.random()*0.8;}}
  // boss
  if(BS.boss){const B=BS.boss;B.t+=dt;B.x+=B.vx*dt;if(B.x<10||B.x>VW-B.w-10)B.vx*=-1;B.y=30+Math.sin(B.t)*8;B.shootT-=dt;if(B.shootT<=0){for(let i=-1;i<=1;i++)BS.ebullets.push({x:B.x+B.w/2+i*12,y:B.y+B.h,w:4,h:8,vy:120});B.shootT=.7;}
   // hit boss
   for(const b of BS.bullets){if(overlap(b,B)){b.y=-99;B.hp--;SFX.stomp();burst(b.x,b.y,4,['#ffd23f','#fff'],60,.3);if(B.hp<=0){burst(B.x+24,B.y+14,30,['#ff4040','#ffd23f','#fff'],160,.8,2,200);SFX.explode();BS.score+=5000;BS.boss=null;BS.state='won';BS.t=0;}}}
  }
  // bullet vs enemy
  for(const b of BS.bullets)for(const e of BS.enemies){if(!e.dead&&overlap(b,e)){b.y=-99;e.hp--;if(e.hp<=0){e.dead=true;BS.score+=100*(e.type+1);BS.kills++;SFX.explode();burst(e.x+7,e.y+5,8,['#4ecf6a','#fff','#ffd23f'],100,.5);}}}
  BS.enemies=BS.enemies.filter(e=>!e.dead&&e.y<VH+20);
  for(const b of BS.ebullets)b.y+=b.vy*dt;BS.ebullets=BS.ebullets.filter(b=>b.y<VH+10);
  // player hit
  const hit={x:BS.x+8,y:BS.y+6,w:BS.w-16,h:BS.h-10};
  if(BS.inv<=0){for(const b of BS.ebullets){if(overlap(b,hit)){b.y=VH+99;BS.lives--;SFX.hurt();shake(4);BS.inv=2;if(BS.lives<=0){BS.state='dead';BS.t=0;SFX.die();}}}
   for(const e of BS.enemies){if(overlap(e,hit)){e.dead=true;BS.lives--;SFX.hurt();BS.inv=2;if(BS.lives<=0){BS.state='dead';BS.t=0;SFX.die();}}}}
  G.score=BS.score;updateParts(dt);
}

function update(dt){G.t+=dt;
 inp.l=!!(keys.ArrowLeft||keys.KeyA||touch.l);inp.r=!!(keys.ArrowRight||keys.KeyD||touch.r);
 inp.u=!!(keys.ArrowUp||keys.KeyW||touch.u);inp.d=!!(keys.ArrowDown||keys.KeyS||touch.d);
 inp.j=!!(keys.Space||keys.ArrowUp||keys.KeyW||keys.KeyZ||keys.KeyK||touch.j);
 inp.f=!!(keys.Space||keys.KeyZ||keys.KeyK||keys.KeyX||touch.f);
 if(G.state==='exit'){G.stT+=dt;return;}
 if(G.state==='title'){G.stT+=dt;if(mus.id!=='title'){if(unlocked)setMusic('title');}return;}
 if(G.state==='stageselect'){G.stT+=dt;if(mus.id!=='title'&&unlocked)setMusic('title');return;}
 if(G.state==='intro'){G.introT+=dt;if(G.introT>2.0){G.state='play';unlockAudio();setMusic(LV.def.music);}return;}
 if(G.state==='gameover'){G.stT+=dt;if(mus.id!=='gameover')setMusic('gameover');return;}
 if(G.state==='win'){G.stT+=dt;if(mus.id!=='win')setMusic('win');if(Math.random()<.25&&wcoins.length<40)wcoins.push({x:Math.random()*VW,y:-12,vy:rnd(30,70),f:Math.random()*6});for(const c of wcoins){c.y+=c.vy*dt;c.f+=dt*8;}wcoins=wcoins.filter(c=>c.y<VH+12);updateParts(dt);return;}
 if(G.state==='blastar'){if(!G.paused)updateBlastar(dt);return;}
 if(G.paused)return;
 if(G.hitstop>0){G.hitstop-=dt;updateParts(dt);return;}
 G.shake*=Math.exp(-dt*9);if(G.shake<.05)G.shake=0;
 cam.px=cam.x;if(LV)updatePlats(dt);
 if(G.state==='play'){G.levelTime+=dt;updatePlayer(dt);}else if(G.state==='dying')updateDying(dt);else if(G.state==='clear')updateClear(dt);
 if(!LV)return;updateEnemies(dt);updateItems(dt);updateParts(dt);updateCamera(dt);}


// ===== RENDER =====
function shipRow(x,y,w){const a=Math.max(1,Math.round(w*.14)),b=Math.round(w*.32),c=Math.max(1,Math.round(w*.14)),d=Math.max(1,Math.round(w*.16));ctx.fillStyle='#8e96a3';ctx.fillRect(x,y,a,1);ctx.fillStyle='#bcc3cd';ctx.fillRect(x+a,y,b-a,1);ctx.fillStyle='#eef1f5';ctx.fillRect(x+b,y,c,1);ctx.fillStyle='#cbd0d8';ctx.fillRect(x+b+c,y,w-b-c-d,1);ctx.fillStyle='#9aa1ad';ctx.fillRect(x+w-d,y,d,1);}
function drawShip(x,y){for(let i=0;i<16;i++){const hw=Math.max(1,Math.round(9*Math.sqrt((i+1)/16)));shipRow(x+9-hw,y+i,hw*2);}for(let i=16;i<64;i++)shipRow(x,y+i,18);}
function drawBooster(x,y){for(let i=0;i<72;i++)shipRow(x,y+i,18);ctx.fillStyle='#3b3f47';ctx.fillRect(x,y,18,3);}
function drawFlame(cx,y,t,big){const L=(big?30:18)+Math.random()*10;for(let i=0;i<L;i++){const k=1-i/L;const w=Math.max(1,Math.round(14*Math.pow(k,.7)*(.85+Math.random()*.3)));ctx.fillStyle=i<L*.25?'#fff7d6':(i<L*.55?'#ffd23f':'#ff7a1a');ctx.fillRect(Math.round(cx-w/2),y+i,w,1);}}
function drawLaunch(T,cx,C){const X=Math.round(T.x-cx),gy=T.gy,tt=T.towerTop;
 ctx.fillStyle='#3a3d46';ctx.fillRect(X,tt,3,gy-tt);ctx.fillRect(X+11,tt,3,gy-tt);ctx.fillStyle='#5b5f6a';
 for(let y=tt+3;y<gy-2;y+=12)ctx.fillRect(X+3,y,8,1);
 ctx.fillStyle='#2c2f36';ctx.fillRect(X-2,tt-3,18,3);
 const MX=Math.round(T.shipX-8-cx),mt=gy-20,ry=C?Math.round(C.ry):0;
 if(C&&C.ph==='launch'&&ry>-VH-160)drawFlame(MX+17,mt+ry,G.t,true);
 if(ry>-VH-160){let y=mt+ry;if(T.booster){y-=72;drawBooster(MX+8,y);}y-=64;drawShip(MX+8,y);}
 ctx.fillStyle='#868c97';ctx.fillRect(MX,mt,34,4);}
const PLATC={};
function platCanvas(w){if(PLATC[w])return PLATC[w];const c=mk(w,10),g=c.getContext('2d');g.fillStyle='#c3cad6';g.fillRect(0,0,w,6);g.fillStyle='#1e3a7a';g.fillRect(1,1,w-2,4);g.fillStyle='#3d63c4';for(let x=1;x<w-1;x+=4)g.fillRect(x,1,1,4);g.fillRect(1,3,w-2,1);g.fillStyle='#ffffff';g.fillRect(0,0,w,1);g.fillStyle='#5b6372';g.fillRect(0,6,w,1);g.fillRect(w/2-2,6,4,3);return PLATC[w]=c;}
function drawCheckpoint(c,x){const y=c.y;ctx.fillStyle='#7d8594';ctx.fillRect(x-1,y-24,2,24);ctx.fillStyle=c.on?(Math.floor(G.t*3)%2?'#5fff8f':'#2fbf5f'):'#7a3a3a';ctx.fillRect(x-1,y-33,2,3);}
function drawPlayer(a,cx){if(!P||P.hidden)return;if(P.inv>0&&!P.dead&&Math.floor(P.inv*18)%2===0)return;
 const x=lerp(P.px,P.x,a),y=lerp(P.py,P.y,a);let fr;
 if(P.dead)fr='dead';else if(!P.ground)fr='jump';else if(Math.abs(P.vx)>5)fr=['run1','run2','run3','run2'][Math.floor(P.anim)%4];else fr=P.blink?'blink':'idle';
 const img=(P.face>0?EL:ELf)[fr];const sq=P.sq,w=Math.round(img.width/Math.sqrt(sq)),h=Math.round(img.height*sq);
 const cxp=Math.round(x+P.w/2-cx),by=Math.round(y+P.h);
 if(P.power&&!P.dead){const jx=P.face>0?cxp-Math.round(w*.5):cxp+Math.round(w*.15),jy=by-Math.round(h*.4);ctx.fillStyle='#1c1a24';ctx.fillRect(jx-1,jy-1,6,10);ctx.fillStyle='#f2f4f8';ctx.fillRect(jx,jy,4,8);ctx.fillStyle='#2a6fe0';ctx.fillRect(jx,jy+3,4,1);if(P.jetT>0){ctx.fillStyle='#ff7a1a';ctx.fillRect(jx,jy+10,4,3+Math.random()*5);}}
 ctx.drawImage(img,cxp-(w>>1),by-h,w,h);}
function drawEnemies(a,cx){for(const e of LV.ents){if(!e.active&&!e.dead)continue;const ex=Math.round(lerp(e.px,e.x,a)-cx)-1,ey=Math.round(lerp(e.py,e.y,a));if(ex<-20||ex>VW+20)continue;
  if(e.type==='f'){const img=SPAM[Math.floor(G.t*20)%2];if(e.dead){ctx.save();ctx.translate(ex,ey+11);ctx.scale(1,-1);ctx.drawImage(img,0,0);ctx.restore();}else ctx.drawImage(img,ex,ey-3);continue;}
  const set=e.type==='h'?HOP_GOLD:LV.theme.walker,img=set[e.ground?Math.floor(e.anim*7)%2:0];
  if(e.dead&&!e.flip)ctx.drawImage(img,ex-1,ey+e.h-5,18,7);
  else if(e.flip){ctx.save();ctx.translate(ex,ey+14);ctx.scale(1,-1);ctx.drawImage(img,0,0);ctx.restore();}
  else ctx.drawImage(img,ex,ey-2,16,16);}}
function drawParts(cx){for(const p of parts){const al=Math.min(1,p.life/p.max*1.6);ctx.globalAlpha=p.type===2?al*.85:al;ctx.fillStyle=p.col;const x=Math.round(p.x-cx),y=Math.round(p.y);
  if(p.type===1){ctx.fillRect(x-1,y,3,1);ctx.fillRect(x,y-1,1,3);}else if(p.type===2){const s=Math.round(p.sz*(1.8-p.life/p.max*.9));ctx.fillRect(x-(s>>1),y-(s>>1),s,s);}else ctx.fillRect(x,y,p.sz,p.sz);}ctx.globalAlpha=1;}

 x=Math.round(6+cw*2);drawText('LIVES',x,y1,'#ffd23f');ctx.drawImage(HEADI,x,y2);drawText('*'+G.lives,x+10,y2,'#fff');
